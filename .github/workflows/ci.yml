name: Creative Ops CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check server.js
      - run: node --check lib/decision-core.mjs
      - run: node --check lib/sales-core.mjs
      - run: node --check lib/capacity-core.mjs
      - run: node --check lib/reply-core.mjs
      - run: node --check lib/learning-core.mjs
      - run: node --check lib/storage-core.mjs
      - run: node --check public/commercial.js
      - run: node test/smoke.mjs
      - run: node test/p0-smoke.mjs
      - run: node test/sales-smoke.mjs
      - run: node test/capacity-smoke.mjs
      - run: node test/reply-smoke.mjs
      - run: node test/commercial-ui-smoke.mjs
      - run: node test/learning-loop-smoke.mjs
      - run: node test/storage-smoke.mjs
