name: Creative Ops CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check server.js
      - run: node --check lib/decision-core.mjs
      - run: node test/smoke.mjs
      - run: node test/p0-smoke.mjs
